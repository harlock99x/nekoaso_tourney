<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会進行モニター</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151e2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success-bg: #064e3b;
      --success-border: #10b981;
      --success-text: #34d399;
      --border: #1e293b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    .badge { background: var(--primary); color: #0b0f19; font-weight: 900; font-size: 1.5rem; padding: 6px 24px; border-radius: 9999px; }
    .set-tabs { display: flex; gap: 12px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 6px; }
    .tab-btn { background: #1e293b; color: var(--text-muted); border: 2px solid transparent; padding: 10px 24px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text); background: #334155; }
    .tab-btn.active { background: var(--primary); color: #0b0f19; border-color: var(--primary); }
    .tab-btn.has-current::after { content: " ●"; color: #ef4444; font-size: 0.8rem; }
    .main-grid { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    h2 { margin-top: 0; font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; }
    .round-section { margin-bottom: 24px; }
    .round-title { font-size: 1.15rem; font-weight: bold; color: var(--primary); margin-bottom: 12px; }
    .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .match-item { background: #0b0f19; border: 2px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .match-item.finished { background: var(--success-bg); border-color: var(--success-border); }
    .table-title { font-size: 1.05rem; font-weight: bold; color: var(--primary); }
    .players { font-size: 1.1rem; margin: 8px 0; font-weight: bold; }
    .winner { color: #38bdf8; text-decoration: underline; }
    .status-text { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); }
    .status-text.done { color: var(--success-text); }
    
    /* ランキング表 */
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 0.8rem; }
    .rank-1 { color: #facc15; font-weight: bold; }
    .rank-2 { color: #e2e8f0; font-weight: bold; }
    .rank-3 { color: #f97316; font-weight: bold; }
    .qr-card { text-align: center; margin-top: 24px; }
    .qr-card img { width: 150px; height: 150px; background: white; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>

<header>
  <h1 style="margin: 0; font-size: 2.2rem;">🏆 トーナメント対戦モニター</h1>
  <div id="statusBadge" class="badge">エントリー受付中</div>
</header>

<div class="set-tabs" id="tabsContainer"></div>

<div class="main-grid">
  <!-- 左：対戦卓 -->
  <div class="card">
    <h2 id="setCardTitle">⚔️ 対戦一覧</h2>
    <div id="setRoundsContainer">
      <div style="color: var(--text-muted); padding: 20px;">組み合わせ決定をお待ちください</div>
    </div>
  </div>

  <!-- 右：厳密オポネントランキング ＆ QR -->
  <div>
    <div class="card">
      <h2>📊 総合オポネント順位表</h2>
      <table>
        <thead>
          <tr>
            <th style="width: 35px;">順位</th>
            <th>名前</th>
            <th>勝敗</th>
            <th>勝率</th>
            <th>OMW%</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="5" style="color: var(--text-muted);">集計中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card qr-card">
      <h3 style="margin: 0 0 10px 0; font-size: 1.1rem;">📱 スマホからエントリー</h3>
      <img id="qrImage" src="" alt="エントリーQR">
      <div id="entryUrlText" style="margin-top: 6px; font-size: 0.75rem; color: var(--text-muted); word-break: break-all;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { 
    getFirestore, doc, onSnapshot, collection, query, where, getDocs 
  } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuzPz78YXhv9xzJArBBKEhGCw9Fpk3yck",
  authDomain: "my-tourney-app.firebaseapp.com",
  projectId: "my-tourney-app",
  storageBucket: "my-tourney-app.firebasestorage.app",
  messagingSenderId: "884106201914",
  appId: "1:884106201914:web:341be2531f580fb9e15e03",
  measurementId: "G-V2Z2M7YX3E"
};
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const TOURNAMENT_ID = "main-event";

  const baseUrl = window.location.href.split("/display.html")[0];
  const entryUrl = baseUrl + "/index.html";
  document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(entryUrl)}`;
  document.getElementById("entryUrlText").textContent = entryUrl;

  let currentViewingSet = 1;
  let activeTourneySet = 1;
  let maxSetFound = 1;
  let allPlayers = new Map();

  function renderTabs() {
    const container = document.getElementById("tabsContainer");
    container.innerHTML = "";
    const totalSets = Math.max(maxSetFound, activeTourneySet, 3);
    for (let s = 1; s <= totalSets; s++) {
      const btn = document.createElement("button");
      btn.textContent = `Set ${s}`;
      btn.className = `tab-btn ${s === currentViewingSet ? 'active' : ''} ${s === activeTourneySet ? 'has-current' : ''}`;
      btn.onclick = () => {
        currentViewingSet = s;
        renderTabs();
        document.getElementById("setCardTitle").textContent = `⚔️ Set ${currentViewingSet} の対戦一覧`;
        renderSetMatches();
      };
      container.appendChild(btn);
    }
  }

  onSnapshot(collection(db, `tournaments/${TOURNAMENT_ID}/players`), (snap) => {
    allPlayers.clear();
    snap.forEach(d => allPlayers.set(d.id, { name: d.data().name, isActive: d.data().isActive !== false }));
    updateStrictRanking();
  });

  onSnapshot(doc(db, "tournaments", TOURNAMENT_ID), (snap) => {
    if (!snap.exists()) return;
    const t = snap.data();
    const badge = document.getElementById("statusBadge");

    if (t.status === "entry") {
      badge.textContent = "エントリー受付中";
      activeTourneySet = 1;
    } else if (t.status === "finished") {
      badge.textContent = "全日程終了";
    } else {
      badge.textContent = `Set ${t.currentSet} - 第${t.currentRound}回戦`;
      if (activeTourneySet !== t.currentSet) {
        activeTourneySet = t.currentSet;
        currentViewingSet = t.currentSet;
      }
    }
    renderTabs();
    document.getElementById("setCardTitle").textContent = `⚔️ Set ${currentViewingSet} の対戦一覧`;
    renderSetMatches();
    updateStrictRanking();
  });

  onSnapshot(collection(db, `tournaments/${TOURNAMENT_ID}/matches`), (snap) => {
    let highestSet = 1;
    snap.forEach(d => {
      const m = d.data();
      if (m.set && m.set > highestSet) highestSet = m.set;
    });
    if (highestSet !== maxSetFound) {
      maxSetFound = highestSet;
      renderTabs();
    }
    renderSetMatches();
    updateStrictRanking();
  });

  async function renderSetMatches() {
    const q = query(collection(db, `tournaments/${TOURNAMENT_ID}/matches`), where("set", "==", currentViewingSet));
    const snap = await getDocs(q);
    const container = document.getElementById("setRoundsContainer");

    if (snap.empty) {
      container.innerHTML = `<div style="color: var(--text-muted); padding: 20px;">Set ${currentViewingSet} はまだ開始されていません</div>`;
      return;
    }

    const rounds = {};
    let maxRound = 1;
    snap.forEach(d => {
      const m = d.data();
      if (!rounds[m.round]) rounds[m.round] = [];
      rounds[m.round].push(m);
      if (m.round > maxRound) maxRound = m.round;
    });

    container.innerHTML = "";
    for (let r = 1; r <= maxRound; r++) {
      const list = rounds[r];
      if (!list || list.length === 0) continue;
      list.sort((a, b) => a.tableNo - b.tableNo);

      const section = document.createElement("div");
      section.className = "round-section";
      section.innerHTML = `<div class="round-title">▶ 第 ${r} 回戦</div>`;

      const grid = document.createElement("div");
      grid.className = "matches-grid";
      list.forEach(m => {
        const isDone = m.status === "finished";
        const p1Win = (m.winnerId === m.player1.id);
        const p2Win = (m.winnerId === m.player2.id);
        const div = document.createElement("div");
        div.className = `match-item ${isDone ? "finished" : ""}`;
        div.innerHTML = `
          <div class="table-title">第 ${m.tableNo} 卓</div>
          <div class="players">
            <span class="${p1Win ? 'winner' : ''}">${m.player1.name}</span> vs <span class="${p2Win ? 'winner' : ''}">${m.player2.name}</span>
          </div>
          <div class="status-text ${isDone ? 'done' : ''}">${isDone ? `✓ 終了 (${m.score1 ?? 0} - ${m.score2 ?? 0})` : '対戦中...'}</div>
        `;
        grid.appendChild(div);
      });
      section.appendChild(grid);
      container.appendChild(section);
    }
  }

  // 厳密なタイブレーク（オポネント計算）
  async function updateStrictRanking() {
    const matchesSnap = await getDocs(collection(db, `tournaments/${TOURNAMENT_ID}/matches`));
    const stats = new Map();

    allPlayers.forEach((val, id) => {
      stats.set(id, {
        id, name: val.name,
        matchesPlayed: 0, matchWins: 0, matchDraws: 0, matchLosses: 0,
        gameWon: 0, gameTotal: 0,
        opponents: []
      });
    });

    matchesSnap.forEach(d => {
      const m = d.data();
      if (m.status !== "finished") return;

      const p1 = stats.get(m.player1.id);
      const p2 = stats.get(m.player2.id);

      const s1 = m.score1 ?? 0;
      const s2 = m.score2 ?? 0;

      if (p1) {
        p1.matchesPlayed++;
        p1.gameWon += s1;
        p1.gameTotal += (s1 + s2);
        if (m.player2.id !== "BYE") p1.opponents.push(m.player2.id);

        if (m.winnerId === p1.id) p1.matchWins++;
        else if (m.winnerId === "DRAW") p1.matchDraws++;
        else p1.matchLosses++;
      }

      if (p2 && m.player2.id !== "BYE") {
        p2.matchesPlayed++;
        p2.gameWon += s2;
        p2.gameTotal += (s1 + s2);
        p2.opponents.push(m.player1.id);

        if (m.winnerId === p2.id) p2.matchWins++;
        else if (m.winnerId === "DRAW") p2.matchDraws++;
        else p2.matchLosses++;
      }
    });

    // マッチ勝率（MW%）の計算（最低0.33保証は公式ルール準拠）
    stats.forEach(p => {
      if (p.matchesPlayed === 0) {
        p.mw = 0;
        p.gw = 0;
      } else {
        const rawMw = (p.matchWins * 3 + p.matchDraws * 1) / (p.matchesPlayed * 3);
        p.mw = Math.max(rawMw, 0.33);
        p.displayWinRate = (p.matchWins / p.matchesPlayed * 100).toFixed(0);
        p.gw = (p.gameTotal > 0) ? (p.gameWon / p.gameTotal) : 0;
      }
    });

    // オポネント勝率（OMW%）の計算
    stats.forEach(p => {
      if (p.opponents.length === 0) {
        p.omw = 0;
      } else {
        let sumMw = 0;
        p.opponents.forEach(oppId => {
          const opp = stats.get(oppId);
          sumMw += opp ? opp.mw : 0.33;
        });
        p.omw = sumMw / p.opponents.length;
      }
    });

    // 厳密ソート：マッチ勝点 > OMW% > ゲーム勝率(GW%)
    const ranked = Array.from(stats.values()).sort((a, b) => {
      const ptsA = a.matchWins * 3 + a.matchDraws;
      const ptsB = b.matchWins * 3 + b.matchDraws;
      if (ptsB !== ptsA) return ptsB - ptsA;
      if (b.omw !== a.omw) return b.omw - a.omw;
      return b.gw - a.gw;
    });

    const tbody = document.getElementById("rankingBody");
    tbody.innerHTML = "";

    if (ranked.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted);">参加者待ち</td></tr>';
      return;
    }

    ranked.forEach((p, idx) => {
      const rank = idx + 1;
      let rankClass = (rank === 1) ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
      const omwPercent = (p.omw * 100).toFixed(1);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="${rankClass}">#${rank}</td>
        <td class="${rankClass}"><strong>${p.name}</strong></td>
        <td>${p.matchWins}勝${p.matchLosses}敗</td>
        <td>${p.displayWinRate ?? 0}%</td>
        <td style="color: var(--primary);">${omwPercent}%</td>
      `;
      tbody.appendChild(tr);
    });
  }

  renderTabs();
</script>
</body>
</html>
