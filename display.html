<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会進行モニター</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151e2e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success-bg: #064e3b;
      --success-border: #10b981;
      --success-text: #34d399;
      --border: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge {
      background: var(--primary);
      color: #0b0f19;
      font-weight: 900;
      font-size: 1.5rem;
      padding: 6px 24px;
      border-radius: 9999px;
    }
    /* セット切り替えタブ（横スクロール対応） */
    .set-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .tab-btn {
      background: #1e293b;
      color: var(--text-muted);
      border: 2px solid transparent;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: #334155; }
    .tab-btn.active {
      background: var(--primary);
      color: #0b0f19;
      border-color: var(--primary);
    }
    .tab-btn.has-current::after {
      content: " ●";
      color: #ef4444;
      font-size: 0.8rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    h2 {
      margin-top: 0;
      font-size: 1.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .round-section { margin-bottom: 24px; }
    .round-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .match-item {
      background: #0b0f19;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .match-item.finished {
      background: var(--success-bg);
      border-color: var(--success-border);
    }
    .table-title { font-size: 1.05rem; font-weight: bold; color: var(--primary); }
    .players { font-size: 1.15rem; margin: 8px 0; font-weight: bold; }
    .winner { color: #38bdf8; text-decoration: underline; }
    .status-text { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); }
    .status-text.done { color: var(--success-text); }

    /* ランキング表 */
    table { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); }
    .rank-1 { color: #facc15; font-weight: bold; }
    .rank-2 { color: #e2e8f0; font-weight: bold; }
    .rank-3 { color: #f97316; font-weight: bold; }

    /* QRカード */
    .qr-card { text-align: center; margin-top: 24px; }
    .qr-card img { width: 170px; height: 170px; background: white; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>

<header>
  <h1 style="margin: 0; font-size: 2.2rem;">🏆 トーナメント対戦モニター</h1>
  <div id="statusBadge" class="badge">エントリー受付中</div>
</header>

<!-- ★ ここにセット数に応じてボタンが自動生成されます ★ -->
<div class="set-tabs" id="tabsContainer"></div>

<div class="main-grid">
  <!-- 左：選択中セットの対戦（R1〜R3...が順に並ぶ） -->
  <div class="card">
    <h2 id="setCardTitle">⚔️ 対戦一覧</h2>
    <div id="setRoundsContainer">
      <div style="color: var(--text-muted); padding: 20px;">組み合わせ決定をお待ちください</div>
    </div>
  </div>

  <!-- 右：通算ランキング ＆ QRコード -->
  <div>
    <div class="card">
      <h2>📊 総合成績ランキング</h2>
      <table>
        <thead>
          <tr>
            <th style="width: 45px;">順位</th>
            <th>プレイヤー</th>
            <th style="width: 65px;">勝敗</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="3" style="color: var(--text-muted);">集計中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card qr-card">
      <h3 style="margin: 0 0 12px 0;">📱 スマホからエントリー</h3>
      <img id="qrImage" src="" alt="エントリーQRコード">
      <div id="entryUrlText" style="margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); word-break: break-all;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { 
    getFirestore, doc, onSnapshot, collection, query, where, getDocs 
  } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuzPz78YXhv9xzJArBBKEhGCw9Fpk3yck",
  authDomain: "my-tourney-app.firebaseapp.com",
  projectId: "my-tourney-app",
  storageBucket: "my-tourney-app.firebasestorage.app",
  messagingSenderId: "884106201914",
  appId: "1:884106201914:web:341be2531f580fb9e15e03",
  measurementId: "G-V2Z2M7YX3E"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const TOURNAMENT_ID = "main-event";

  // QRコード生成
  const baseUrl = window.location.href.split("/display.html")[0];
  const entryUrl = baseUrl + "/index.html";
  document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(entryUrl)}`;
  document.getElementById("entryUrlText").textContent = entryUrl;

  let currentViewingSet = 1;
  let activeTourneySet = 1;
  let maxSetFound = 1;
  let allPlayers = new Map();

  // タブ再描画処理（最大セット数に合わせて動的にボタンを並べる）
  function renderTabs() {
    const container = document.getElementById("tabsContainer");
    container.innerHTML = "";

    // 少なくとも現在の進行セットか最大セットの大きい方まで表示（最低1〜3は確保）
    const totalSetsToDisplay = Math.max(maxSetFound, activeTourneySet, 3);

    for (let s = 1; s <= totalSetsToDisplay; s++) {
      const btn = document.createElement("button");
      btn.textContent = `Set ${s}`;
      btn.className = `tab-btn ${s === currentViewingSet ? 'active' : ''} ${s === activeTourneySet ? 'has-current' : ''}`;
      btn.onclick = () => {
        currentViewingSet = s;
        renderTabs();
        document.getElementById("setCardTitle").textContent = `⚔️ Set ${currentViewingSet} の対戦一覧`;
        renderSetMatches();
      };
      container.appendChild(btn);
    }
  }

  // 1. プレイヤー一覧監視
  onSnapshot(collection(db, `tournaments/${TOURNAMENT_ID}/players`), (snap) => {
    allPlayers.clear();
    snap.forEach(d => allPlayers.set(d.id, d.data().name));
    updateRanking();
  });

  // 2. 大会ステータス監視
  onSnapshot(doc(db, "tournaments", TOURNAMENT_ID), (snap) => {
    if (!snap.exists()) return;
    const t = snap.data();
    const badge = document.getElementById("statusBadge");

    if (t.status === "entry") {
      badge.textContent = "エントリー受付中";
      activeTourneySet = 1;
    } else if (t.status === "finished") {
      badge.textContent = "全日程終了";
    } else {
      badge.textContent = `Set ${t.currentSet} - 第${t.currentRound}回戦`;
      if (activeTourneySet !== t.currentSet) {
        activeTourneySet = t.currentSet;
        currentViewingSet = t.currentSet; // 新セットが始まれば自動でそのタブへ切り替え
      }
    }
    renderTabs();
    document.getElementById("setCardTitle").textContent = `⚔️ Set ${currentViewingSet} の対戦一覧`;
    renderSetMatches();
    updateRanking();
  });

  // 3. マッチの全件監視（マッチデータから最大セット数を拾ってタブを拡張）
  onSnapshot(collection(db, `tournaments/${TOURNAMENT_ID}/matches`), (snap) => {
    let highestSet = 1;
    snap.forEach(d => {
      const m = d.data();
      if (m.set && m.set > highestSet) highestSet = m.set;
    });

    if (highestSet !== maxSetFound) {
      maxSetFound = highestSet;
      renderTabs();
    }

    renderSetMatches();
    updateRanking();
  });

  async function renderSetMatches() {
    const q = query(
      collection(db, `tournaments/${TOURNAMENT_ID}/matches`),
      where("set", "==", currentViewingSet)
    );
    const snap = await getDocs(q);

    const container = document.getElementById("setRoundsContainer");
    if (snap.empty) {
      container.innerHTML = `<div style="color: var(--text-muted); padding: 20px;">Set ${currentViewingSet} はまだ開始されていません</div>`;
      return;
    }

    // ラウンドごとにグループ化（何ラウンドあっても動的に対応）
    const rounds = {};
    let maxRoundInThisSet = 1;

    snap.forEach(d => {
      const m = d.data();
      if (!rounds[m.round]) rounds[m.round] = [];
      rounds[m.round].push(m);
      if (m.round > maxRoundInThisSet) maxRoundInThisSet = m.round;
    });

    container.innerHTML = "";

    // 第1回戦から最終回戦まで順に表示
    for (let r = 1; r <= maxRoundInThisSet; r++) {
      const list = rounds[r];
      if (!list || list.length === 0) continue;

      list.sort((a, b) => a.tableNo - b.tableNo);

      const section = document.createElement("div");
      section.className = "round-section";

      const title = document.createElement("div");
      title.className = "round-title";
      title.textContent = `▶ 第 ${r} 回戦`;
      section.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "matches-grid";

      list.forEach(m => {
        const isDone = m.status === "finished";
        const p1Win = (m.winnerId === m.player1.id);
        const p2Win = (m.winnerId === m.player2.id);

        let statusStr = "対戦中...";
        if (isDone) {
          statusStr = `✓ 終了 (${m.score1 ?? 0} - ${m.score2 ?? 0})`;
        }

        const item = document.createElement("div");
        item.className = `match-item ${isDone ? "finished" : ""}`;
        item.innerHTML = `
          <div class="table-title">第 ${m.tableNo} 卓</div>
          <div class="players">
            <span class="${p1Win ? 'winner' : ''}">${m.player1.name}</span>
            <span style="color: var(--text-muted); font-size: 0.85rem; margin: 0 4px;">vs</span>
            <span class="${p2Win ? 'winner' : ''}">${m.player2.name}</span>
          </div>
          <div class="status-text ${isDone ? 'done' : ''}">${statusStr}</div>
        `;
        grid.appendChild(item);
      });

      section.appendChild(grid);
      container.appendChild(section);
    }
  }

  // 4. 通算ランキング集計
  async function updateRanking() {
    const matchesSnap = await getDocs(collection(db, `tournaments/${TOURNAMENT_ID}/matches`));
    const stats = new Map();

    allPlayers.forEach((name, id) => {
      stats.set(id, { name, wins: 0, losses: 0 });
    });

    matchesSnap.forEach(d => {
      const m = d.data();
      if (m.status !== "finished") return;
      if (m.winnerId === "DRAW") return;

      if (stats.has(m.winnerId)) stats.get(m.winnerId).wins += 1;
      const loserId = (m.winnerId === m.player1.id) ? m.player2.id : m.player1.id;
      if (stats.has(loserId)) stats.get(loserId).losses += 1;
    });

    const ranked = Array.from(stats.values()).sort((a, b) => b.wins - a.wins || a.losses - b.losses);
    const tbody = document.getElementById("rankingBody");
    tbody.innerHTML = "";

    if (ranked.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted);">参加者待ち</td></tr>';
      return;
    }

    ranked.forEach((p, idx) => {
      const rank = idx + 1;
      let rankClass = "";
      if (rank === 1) rankClass = "rank-1";
      else if (rank === 2) rankClass = "rank-2";
      else if (rank === 3) rankClass = "rank-3";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="${rankClass}">#${rank}</td>
        <td class="${rankClass}">${p.name}</td>
        <td><b>${p.wins}</b>勝${p.losses}敗</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 初回起動時レンダリング
  renderTabs();
</script>
</body>
</html>
